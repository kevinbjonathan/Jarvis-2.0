<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">J.A.R.V.I.S. HUD hero</title>
  <desc id="desc">Animated cyan holographic interface with concentric rings, a radar sweep, a reactor core, and the J.A.R.V.I.S. wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070c"/>
      <stop offset="0.55" stop-color="#07111b"/>
      <stop offset="1" stop-color="#030609"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset="0.28" stop-color="#8bf3ff"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.38"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#164e63" stroke-opacity="0.22" stroke-width="0.7"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <rect width="1200" height="440" fill="url(#halo)" opacity="0.55"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2">
    <path d="M22 62V22h40M1138 22h40v40M22 378v40h40M1178 378v40h-40"/>
  </g>

  <!-- left identity block -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="84" fill="#67e8f9" font-size="11" letter-spacing="5" opacity="0.85">STARK-CLASS PERSONAL INTELLIGENCE</text>
    <text x="76" y="170" fill="#ecfeff" font-size="76" font-weight="600" letter-spacing="6" filter="url(#glow)">J.A.R.V.I.S.</text>
    <text x="80" y="207" fill="#67e8f9" font-size="14" letter-spacing="4.2">JUST A RATHER VERY INTELLIGENT SYSTEM</text>
    <g fill="#8fa9bb" font-size="13.5" letter-spacing="1.4">
      <text x="80" y="249">Personal AI assistant. Hybrid intelligence.</text>
      <text x="80" y="271">Voice, memory, desktop automation, system awareness.</text>
    </g>

    <g transform="translate(80,320)" font-size="10.5" letter-spacing="2.4">
      <circle cx="4" cy="-3.5" r="3.2" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="0" fill="#a7f3d0">SYSTEM ONLINE</text>
      <path d="M132 -9v12" stroke="#164e63"/>
      <text x="148" y="0" fill="#67e8f9">HYBRID ROUTING</text>
      <path d="M280 -9v12" stroke="#164e63"/>
      <text x="296" y="0" fill="#67e8f9">SQLITE MEMORY</text>
      <path d="M420 -9v12" stroke="#164e63"/>
      <text x="436" y="0" fill="#67e8f9">LOCAL CONTROL</text>
    </g>
  </g>

  <!-- reactor HUD -->
  <g transform="translate(930 218)">
    <circle r="178" fill="url(#halo)" opacity="0.55"/>
    <circle r="166" fill="none" stroke="#164e63" stroke-width="0.8" stroke-opacity="0.65"/>

    <g fill="none" stroke="url(#ring)">
      <circle r="152" stroke-width="1.4" stroke-dasharray="2 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle r="132" stroke-width="1" stroke-dasharray="44 10 4 10">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="112" stroke-width="0.8" stroke-dasharray="1 7" stroke-opacity="0.7"/>
    </g>

    <!-- radar sweep -->
    <g>
      <path d="M0 0 L0 -150 A150 150 0 0 1 106 -106 Z" fill="url(#sweep)" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- tick ring -->
    <g stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <path d="M0 -96v10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></path>
      <path d="M83.1 -48 74.5 -43"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></path>
      <path d="M83.1 48 74.5 43"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></path>
      <path d="M0 96v-10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></path>
      <path d="M-83.1 48-74.5 43"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></path>
      <path d="M-83.1 -48-74.5 -43"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></path>
    </g>

    <!-- orbit nodes -->
    <g fill="#67e8f9">
      <circle cx="0" cy="-152" r="3.2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" additive="sum"/></circle>
      <circle cx="132" cy="0" r="2.4" fill="#a5f3fc"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/></circle>
    </g>

    <!-- core -->
    <circle r="52" fill="url(#core)">
      <animate attributeName="r" values="48;56;48" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <g fill="none" stroke="#cffafe" stroke-width="1.6" filter="url(#glow)">
      <path d="M0 -34 31 22H-31Z"/>
      <circle r="5" fill="#ecfeff" stroke="none"/>
    </g>
    <text x="0" y="122" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="3.4" text-anchor="middle">ARC REACTOR / CORE</text>
  </g>

  <!-- scan line -->
  <g>
    <rect x="40" y="0" width="1120" height="1.2" fill="#67e8f9" opacity="0.35">
      <animate attributeName="y" values="70;370;70" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulse trace -->
  <g transform="translate(78 388)" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M0 0h70l12-12 10 24 12-12h48l9-8 9 16 9-8h60" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M260 0h310l10-6 8 12 8-6h90" stroke-opacity="0.35"/>
  </g>
  <text x="1120" y="392" fill="#3f6373" font-family="Consolas, monospace" font-size="9" letter-spacing="1.5" text-anchor="end">LOCAL NODE / 127.0.0.1:8787</text>
</svg>
