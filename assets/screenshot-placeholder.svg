<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Screenshot placeholder</title>
  <desc id="desc">A clearly labelled placeholder for a future JARVIS interface screenshot. It is not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#08131d"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#164e63" stroke-opacity="0.2" stroke-width="0.7"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.3">
    <path d="M36 88V36h52M1112 36h52v52M36 587v52h52M1164 587v52h-52"/>
  </g>
  <g transform="translate(600 300)" fill="none" stroke="#67e8f9" filter="url(#glow)">
    <circle r="82" stroke-width="1.2" stroke-dasharray="2 8" stroke-opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="56" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M0 -24 21 14H-21Z" stroke-width="1.4"/>
  </g>
  <g font-family="Consolas, monospace" text-anchor="middle">
    <text x="600" y="442" fill="#67e8f9" font-size="15" letter-spacing="5">SCREENSHOT SLOT / CAPTURE PENDING</text>
    <text x="600" y="476" fill="#7f9aaa" font-size="12" letter-spacing="2">NO IMAGE HAS BEEN FABRICATED. RUN JARVIS AND CAPTURE THE LIVE HUD.</text>
    <text x="600" y="516" fill="#3f6373" font-size="10" letter-spacing="2">npm start  ·  http://localhost:5173  ·  PRESS D FOR DIAGNOSTICS</text>
  </g>
  <text x="600" y="628" fill="#2f4f5e" font-family="Consolas, monospace" font-size="9" letter-spacing="2" text-anchor="middle">ASSETS/SCREENSHOTS/README.MD LISTS THE CAPTURE CHECKLIST</text>
</svg>
